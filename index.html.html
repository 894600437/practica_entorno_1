<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Slyle.css">
    <title>Reserva de espacios</title>
</head>
<body>
    <h1>Reservar espacio</h1>
    <div>
        <label for="zona">Ubicación:</label>
        <input type="text" id="zona" class="input-zona" value="Centro de Pachuca"><br>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" value="2026-09-26"><br>
        <label for="hora">Hora:</label>
        <input type="time" id="hora" value="12:00"><br>
        <button type="button">Confirmar Reserva</button>
    </div>
    <h2>Detalles del Espacio</h2>
    <h3>Estacionamiento Centro</h3>
    <p><strong>Ubicación:</strong> Centro de Pachuca[cite: 2]</p>
    <p><strong>Precio:</strong> $20 por hora[cite: 2]</p>
    <p><strong>Disponibilidad:</strong> 5 espacios[cite: 2]</p>
    <button type="button">Reservar</button>
</body>
</html>
